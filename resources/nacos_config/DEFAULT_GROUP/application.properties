# xxl-job
xxl.job.admin.addresses=http://127.0.0.1:8081/xxl-job-admin
xxl.job.executor.logretentiondays=3
xxl.job.accessToken=default_token

# jwt secret
jwt.token.secret=roncoo-education

# multipart
spring.servlet.multipart.location=/tmp/roncoo-education/
spring.servlet.multipart.max-file-size=1000MB
spring.servlet.multipart.max-request-size=1000MB
spring.servlet.multipart.file-size-threshold=10MB

# cache
spring.cache.type=redis
spring.cache.redis.time-to-live=10000
spring.cache.redis.cache-null-values=false

# logging
logging.logback.rollingpolicy.max-history=3
logging.config=classpath:logback-spring.xml

# error
server.error.include-exception=true
server.error.include-message=always

# management
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=ALWAYS

# mvn
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# aop
spring.aop.auto=true

# jackson
spring.jackson.time-zone=Asia/Chongqing

# seata
seata.application-id=${spring.application.name}
seata.registry.type=nacos
seata.registry.nacos.group=SEATA_GROUP
seata.registry.nacos.application=seata-server
seata.registry.nacos.server-addr=${spring.cloud.nacos.server-addr}
seata.registry.nacos.username=${spring.cloud.nacos.username}
seata.registry.nacos.password=${spring.cloud.nacos.password}
seata.registry.nacos.namespace=${spring.cloud.nacos.namespace}
seata.config.type=nacos
seata.config.nacos.group=SEATA_GROUP
seata.config.nacos.server-addr=${spring.cloud.nacos.server-addr}
seata.config.nacos.username=${spring.cloud.nacos.username}
seata.config.nacos.password=${spring.cloud.nacos.password}
seata.config.nacos.namespace=${spring.cloud.nacos.namespace}
