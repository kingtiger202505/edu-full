version: "3.8"

# ============================================================
# 领课教育 roncoo-education 26.0.0-RELEASE 本地环境
# 包含: MySQL / Redis / Nacos / xxl-job-admin / Seata
# 使用方法:
#   docker compose up -d
# ============================================================

services:
  # ---------- MySQL 8.0 ----------
  mysql:
    image: mysql:8.0.34
    container_name: edu-mysql
    restart: always
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: RonCoo.123
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+8:00
      - --default-authentication-plugin=mysql_native_password
      - --max-allowed-packet=64M
    ports:
      - "3306:3306"
    volumes:
      - ./mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pRonCoo.123"]
      interval: 10s
      timeout: 5s
      retries: 30

  # ---------- Redis 6.2 ----------
  redis:
    image: redis:6.2
    container_name: edu-redis
    restart: always
    command: ["redis-server", "--requirepass", "123456", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - ./redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "123456", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------- Nacos 2.4.3 ----------
  nacos:
    image: nacos/nacos-server:v2.4.3
    container_name: edu-nacos
    restart: always
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: "U2VjcmV0S2V5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5"
      NACOS_AUTH_IDENTITY_KEY: serverIdentity
      NACOS_AUTH_IDENTITY_VALUE: security
      JVM_XMS: 256m
      JVM_XMX: 512m
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    volumes:
      - ./nacos-data:/home/nacos/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8848/nacos/v1/console/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 30

  # ---------- xxl-job-admin 3.4.0 ----------
  xxl-job-admin:
    image: xuxueli/xxl-job-admin:3.4.0
    container_name: edu-xxl-job-admin
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PARAMS: "--spring.datasource.url=jdbc:mysql://mysql:3306/os_job?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true --spring.datasource.username=root --spring.datasource.password=RonCoo.123 --xxl.job.accessToken=default_token"
    ports:
      - "8081:8080"
    volumes:
      - ./xxl-job-log:/data/applogs

  # ---------- Seata Server 2.5.0 ----------
  seata-server:
    image: seataio/seata-server:2.5.0
    container_name: edu-seata-server
    restart: always
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SEATA_IP: 127.0.0.1
      STORE_MODE: redis
      SERVER_NODE: 1
      REGISTRY_TYPE: nacos
      REGISTRY_NACOS_SERVER_ADDR: nacos:8848
      REGISTRY_NACOS_NAMESPACE: ""
      REGISTRY_NACOS_GROUP: SEATA_GROUP
      REGISTRY_NACOS_CLUSTER: default
      REGISTRY_NACOS_USERNAME: nacos
      REGISTRY_NACOS_PASSWORD: nacos2026
      CONFIG_TYPE: nacos
      CONFIG_NACOS_SERVER_ADDR: nacos:8848
      CONFIG_NACOS_NAMESPACE: ""
      CONFIG_NACOS_GROUP: SEATA_GROUP
      CONFIG_NACOS_USERNAME: nacos
      CONFIG_NACOS_PASSWORD: nacos2026
    ports:
      - "7091:7091"
      - "8091:8091"

  # ---------- MinIO RELEASE.2024-01-18 ----------
  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: edu-minio
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      TZ: Asia/Shanghai
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # API 接口（后端及前台访问）
      - "9001:9001"   # Web 控制台页面
    volumes:
      - ./minio-data:/data




