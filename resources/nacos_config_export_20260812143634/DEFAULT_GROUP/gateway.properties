# routes（修正：去掉无效的 server.webflux 前缀）
spring.cloud.gateway.routes[0].id=openapi
spring.cloud.gateway.routes[0].uri=http://localhost:${server.port}
spring.cloud.gateway.routes[0].predicates[0]=Path=/*/v3/api-docs
spring.cloud.gateway.routes[0].filters[0]=RewritePath=/?(?<segment>.*)/v3/api-docs,/$\{segment}-server/v3/api-docs

spring.cloud.gateway.routes[1].id=service-system
spring.cloud.gateway.routes[1].uri=lb://service-system
spring.cloud.gateway.routes[1].predicates[0]=Path=/system/**

spring.cloud.gateway.routes[2].id=service-user
spring.cloud.gateway.routes[2].uri=lb://service-user
spring.cloud.gateway.routes[2].predicates[0]=Path=/user/**

spring.cloud.gateway.routes[3].id=service-course
spring.cloud.gateway.routes[3].uri=lb://service-course
spring.cloud.gateway.routes[3].predicates[0]=Path=/course/**

# logging
management.endpoint.logfile.external-file=${user.home}/logs/gateway/info.log

# knife4j
knife4j.gateway.enabled=true
knife4j.setting.language=zh_cn
knife4j.gateway.strategy=discover
knife4j.gateway.discover.version=openapi3
knife4j.gateway.discover.enabled=${knife4j.gateway.enabled}
spring.cloud.gateway.discovery.locator.enabled=${knife4j.gateway.enabled}
spring.cloud.gateway.discovery.locator.lower-case-service-id=${knife4j.gateway.enabled}
