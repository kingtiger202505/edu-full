server:
  port: 7091

spring:
  application:
    name: seata-server
  main:
    web-application-type: none

logging:
  config: classpath:logback-spring.xml
  file:
    path: ${log.home:${user.home}/logs/seata}
  extend:
    logstash-appender:
      enabled: false
      destination: 127.0.0.1:4560
    kafka-appender:
      enabled: false
      bootstrap-servers: 127.0.0.1:9092
      topic: logback_to_logstash
      producer:
        acks: 0
        linger-ms: 1000
        max-block-ms: 0
    metric-appender:
      enabled: false

seata:
  # 事务通信端口（必须显式指定，否则可能误用 server.port 7091 注册到 Nacos）
  server:
    service-port: 8091
  # 配置中心：从 Nacos 的 SEATA_GROUP/seata.properties 读取 store.* 等业务配置
  config:
    type: nacos
    nacos:
      server-addr: 172.27.227.88:18848
      namespace: ""
      group: SEATA_GROUP
      data-id: seata.properties
      username: nacos
      password: nacos2026
  # 注册中心：Seata 启动后注册到 Nacos，应用客户端据此发现 Seata
  registry:
    type: nacos
    nacos:
      application: seata-server
      server-addr: 172.27.227.88:18848
      namespace: ""
      group: SEATA_GROUP
      cluster: default
      username: nacos
      password: nacos2026
