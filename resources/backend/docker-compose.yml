version: "3.8"

networks:
  edu-net:
    name: edu-net
    driver: bridge

services:
  gateway:
    image: ${REGISTRY:-crpi-p83fit5o5eksva55.cn-beijing.personal.cr.aliyuncs.com}/kingtiger-edu/gateway:${IMAGE_TAG:-latest}
    container_name: edu-gateway
    restart: always
    environment:
      - NACOS_SERVER_ADDR=${MIDDLEWARE_HOST:-8.140.227.42:18848}
      - SPRING_CLOUD_NACOS_DISCOVERY_IP=edu-gateway
      - SEATA_ENABLED=false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:7700"
    networks:
      - edu-net

  service-system:
    image: ${REGISTRY:-crpi-p83fit5o5eksva55.cn-beijing.personal.cr.aliyuncs.com}/kingtiger-edu/system:${IMAGE_TAG:-latest}
    container_name: edu-service-system
    restart: always
    environment:
      - NACOS_SERVER_ADDR=${MIDDLEWARE_HOST:-8.140.227.42:18848}
      - SPRING_CLOUD_NACOS_DISCOVERY_IP=edu-service-system
      - SEATA_ENABLED=false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8710:7710"
    networks:
      - edu-net

  service-user:
    image: ${REGISTRY:-crpi-p83fit5o5eksva55.cn-beijing.personal.cr.aliyuncs.com}/kingtiger-edu/user:${IMAGE_TAG:-latest}
    container_name: edu-service-user
    restart: always
    environment:
      - NACOS_SERVER_ADDR=${MIDDLEWARE_HOST:-8.140.227.42:18848}
      - SPRING_CLOUD_NACOS_DISCOVERY_IP=edu-service-user
      - SEATA_ENABLED=false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8720:7720"
    networks:
      - edu-net

  service-course:
    image: ${REGISTRY:-crpi-p83fit5o5eksva55.cn-beijing.personal.cr.aliyuncs.com}/kingtiger-edu/course:${IMAGE_TAG:-latest}
    container_name: edu-service-course
    restart: always
    environment:
      - NACOS_SERVER_ADDR=${MIDDLEWARE_HOST:-8.140.227.42:18848}
      - SPRING_CLOUD_NACOS_DISCOVERY_IP=edu-service-course
      - SEATA_ENABLED=false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8730:7730"
    networks:
      - edu-net
