version: "3.8"

networks:
  edu-net:
    name: edu-net
    driver: bridge

services:
  gateway:
    image: ${REGISTRY:-crpi-p83fit5o5eksva55.cn-beijing.personal.cr.aliyuncs.com}/kingtiger-edu/gateway:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: target/gateway.jar
    container_name: edu-gateway
    restart: always
    environment:
      - NACOS_SERVER_ADDR=host.docker.internal:18848
      - SEATA_ENABLED=false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:7700"
    networks:
      - edu-net

  service-system:
    image: ${REGISTRY:-crpi-p83fit5o5eksva55.cn-beijing.personal.cr.aliyuncs.com}/kingtiger-edu/system:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: target/system.jar
    container_name: edu-service-system
    restart: always
    environment:
      - NACOS_SERVER_ADDR=host.docker.internal:18848
      - SEATA_ENABLED=false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8710:7710"
    networks:
      - edu-net

  service-user:
    image: ${REGISTRY:-crpi-p83fit5o5eksva55.cn-beijing.personal.cr.aliyuncs.com}/kingtiger-edu/user:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: target/user.jar
    container_name: edu-service-user
    restart: always
    environment:
      - NACOS_SERVER_ADDR=host.docker.internal:18848
      - SEATA_ENABLED=false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8720:7720"
    networks:
      - edu-net

  service-course:
    image: ${REGISTRY:-crpi-p83fit5o5eksva55.cn-beijing.personal.cr.aliyuncs.com}/kingtiger-edu/course:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: target/course.jar
    container_name: edu-service-course
    restart: always
    environment:
      - NACOS_SERVER_ADDR=host.docker.internal:18848
      - SEATA_ENABLED=false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8730:7730"
    networks:
      - edu-net
