name: Build and Deploy to Linux Server

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Java Microservices
        run: |
          cd roncoo-education
          mvn clean package -DskipTests
          mkdir -p ../resources/backend/target
          cp roncoo-education-gateway/target/gateway.jar ../resources/backend/target/
          cp roncoo-education-service/roncoo-education-service-system/target/system.jar ../resources/backend/target/
          cp roncoo-education-service/roncoo-education-service-user/target/user.jar ../resources/backend/target/
          cp roncoo-education-service/roncoo-education-service-course/target/course.jar ../resources/backend/target/

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Admin Frontend
        run: |
          cd roncoo-education-admin
          npm install
          npm run build
          mkdir -p ../resources/frontend/dist/admin
          cp -r dist/* ../resources/frontend/dist/admin/

      - name: Build Web Frontend
        run: |
          cd roncoo-education-web
          npm install
          npx nuxi generate
          mkdir -p ../resources/frontend/dist/web
          cp -r .output/public/* ../resources/frontend/dist/web/

      - name: Copy deployment files to server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "resources/"
          target: "/data/app/"

      - name: Restart Docker services on server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd /data/app/resources/backend && docker compose up -d --build
            cd /data/app/resources/frontend && docker compose up -d
