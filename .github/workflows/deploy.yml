name: Build, Push to Aliyun ACR and Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  # ================= 1. 并行编译后端与前端 =================
  build-backend:
    name: Build Java Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Java Microservices
        run: |
          cd roncoo-education
          mvn clean package -DskipTests -T 1C
          mkdir -p ../dist_artifacts/backend/target
          cp roncoo-education-gateway/target/gateway.jar ../dist_artifacts/backend/target/
          cp roncoo-education-service/roncoo-education-service-system/target/system.jar ../dist_artifacts/backend/target/
          cp roncoo-education-service/roncoo-education-service-user/target/user.jar ../dist_artifacts/backend/target/
          cp roncoo-education-service/roncoo-education-service-course/target/course.jar ../dist_artifacts/backend/target/

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-target
          path: dist_artifacts/backend/target/
          retention-days: 1

  build-frontend-admin:
    name: Build Admin Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: roncoo-education-admin/package.json

      - name: Build Admin
        run: |
          cd roncoo-education-admin
          npm install --prefer-offline --no-audit
          npm run build
          mkdir -p ../dist_artifacts/frontend/dist/admin
          cp -r dist/* ../dist_artifacts/frontend/dist/admin/

      - name: Upload Admin Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-admin-dist
          path: dist_artifacts/frontend/dist/admin/
          retention-days: 1

  build-frontend-web:
    name: Build Web Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: roncoo-education-web/package.json

      - name: Build Web
        run: |
          cd roncoo-education-web
          npm install --prefer-offline --no-audit
          npx nuxi generate
          mkdir -p ../dist_artifacts/frontend/dist/web
          cp -r .output/public/* ../dist_artifacts/frontend/dist/web/

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-web-dist
          path: dist_artifacts/frontend/dist/web/
          retention-days: 1

  # ================= 2. 构建 Docker 镜像并推送至阿里云 ACR =================
  build-and-push-images:
    name: Build and Push Docker Images to Aliyun ACR
    needs: [build-backend, build-frontend-admin, build-frontend-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Backend Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-target
          path: resources/backend/target/

      - name: Download Admin Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-admin-dist
          path: resources/frontend/dist/admin/

      - name: Download Web Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-web-dist
          path: resources/frontend/dist/web/

      - name: Log in to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Microservice Images
        run: |
          REGISTRY="${{ secrets.ALIYUN_REGISTRY }}"

          # 1. Gateway
          docker buildx build --push \
            -t $REGISTRY/kingtiger-edu/gateway:latest \
            --build-arg JAR_FILE=target/gateway.jar \
            -f resources/backend/Dockerfile resources/backend

          # 2. System
          docker buildx build --push \
            -t $REGISTRY/kingtiger-edu/system:latest \
            --build-arg JAR_FILE=target/system.jar \
            -f resources/backend/Dockerfile resources/backend

          # 3. User
          docker buildx build --push \
            -t $REGISTRY/kingtiger-edu/user:latest \
            --build-arg JAR_FILE=target/user.jar \
            -f resources/backend/Dockerfile resources/backend

          # 4. Course
          docker buildx build --push \
            -t $REGISTRY/kingtiger-edu/course:latest \
            --build-arg JAR_FILE=target/course.jar \
            -f resources/backend/Dockerfile resources/backend

  # ================= 3. 服务器通过 SSH 快速拉取部署 =================
  deploy:
    name: Deploy to Server via SSH
    needs: [build-and-push-images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync Compose and Nginx Configs to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "resources/backend/docker-compose.yml,resources/frontend/docker-compose.yml,resources/frontend/nginx.conf"
          target: "/data/app/"

      - name: Remote Pull Images and Restart Docker Services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd /data/app

            # 登录阿里云 ACR 镜像仓库
            docker login -u "${{ secrets.ALIYUN_USERNAME }}" -p "${{ secrets.ALIYUN_PASSWORD }}" "${{ secrets.ALIYUN_REGISTRY }}"

            # 替换镜像地址为 ACR 地址并拉取重启
            export REGISTRY="${{ secrets.ALIYUN_REGISTRY }}"

            cd /data/app/resources/backend
            docker compose pull
            docker compose up -d --force-recreate

            cd /data/app/resources/frontend
            docker compose up -d --force-recreate
