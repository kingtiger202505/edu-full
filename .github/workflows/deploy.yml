name: Build and Deploy to Linux Server

on:
  push:
    branches:
      - master

jobs:
  # ================= 1. 检测变更目录 (Path Filter) =================
  changes:
    name: Check Changed Paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      admin: ${{ steps.filter.outputs.admin }}
      web: ${{ steps.filter.outputs.web }}
      resources: ${{ steps.filter.outputs.resources }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'roncoo-education/**'
            admin:
              - 'roncoo-education-admin/**'
            web:
              - 'roncoo-education-web/**'
            resources:
              - 'resources/**'

  # ================= 2. 条件编译后端与前端 =================
  build-backend:
    name: Build Java Backend
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Java Microservices
        run: |
          cd roncoo-education
          mvn clean package -DskipTests -T 1C
          mkdir -p ../resources/backend/target
          cp roncoo-education-gateway/target/gateway.jar ../resources/backend/target/
          cp roncoo-education-service/roncoo-education-service-system/target/system.jar ../resources/backend/target/
          cp roncoo-education-service/roncoo-education-service-user/target/user.jar ../resources/backend/target/
          cp roncoo-education-service/roncoo-education-service-course/target/course.jar ../resources/backend/target/

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-target
          path: resources/backend/target/
          retention-days: 1

  build-frontend-admin:
    name: Build Admin Frontend
    needs: changes
    if: ${{ needs.changes.outputs.admin == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: roncoo-education-admin/package.json

      - name: Build Admin
        run: |
          cd roncoo-education-admin
          npm install --prefer-offline --no-audit
          npm run build
          mkdir -p ../resources/frontend/dist/admin
          cp -r dist/* ../resources/frontend/dist/admin/

      - name: Upload Admin Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-admin-dist
          path: resources/frontend/dist/admin/
          retention-days: 1

  build-frontend-web:
    name: Build Web Frontend
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: roncoo-education-web/package.json

      - name: Build Web
        run: |
          cd roncoo-education-web
          npm install --prefer-offline --no-audit
          npx nuxi generate
          mkdir -p ../resources/frontend/dist/web
          cp -r .output/public/* ../resources/frontend/dist/web/

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-web-dist
          path: resources/frontend/dist/web/
          retention-days: 1

  # ================= 3. 智能按需打包部署 =================
  deploy:
    name: Deploy to Server
    needs: [changes, build-backend, build-frontend-admin, build-frontend-web]
    if: ${{ always() && !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Backend Artifact (if built)
        if: ${{ needs.changes.outputs.backend == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: backend-target
          path: resources/backend/target/

      - name: Download Admin Artifact (if built)
        if: ${{ needs.changes.outputs.admin == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: frontend-admin-dist
          path: resources/frontend/dist/admin/

      - name: Download Web Artifact (if built)
        if: ${{ needs.changes.outputs.web == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: frontend-web-dist
          path: resources/frontend/dist/web/

      - name: Pack Resources into Single Archive
        run: |
          tar -czf deploy.tar.gz resources/

      - name: SCP Compressed Archive to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "deploy.tar.gz"
          target: "/data/app/"

      - name: Extract Archive and Restart Changed Docker Services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd /data/app
            tar -xzf deploy.tar.gz
            rm -f deploy.tar.gz

            # 只有后端源码改动时才重新编译部署 Java Docker
            if [ "${{ needs.changes.outputs.backend }}" = "true" ]; then
                echo "Deploying backend services..."
                cd /data/app/resources/backend && docker compose up -d --build
            fi

            # resources 单独变更（docker-compose/nginx 配置等），重建后端容器
            if [ "${{ needs.changes.outputs.backend }}" != "true" ] && [ "${{ needs.changes.outputs.resources }}" = "true" ]; then
                echo "Reloading backend services (config only)..."
                cd /data/app/resources/backend && docker compose up -d --force-recreate
            fi

            # 前端源码或 resources 变更，重建前端 Nginx 容器
            if [ "${{ needs.changes.outputs.admin }}" = "true" ] || [ "${{ needs.changes.outputs.web }}" = "true" ] || [ "${{ needs.changes.outputs.resources }}" = "true" ]; then
                echo "Reloading frontend services..."
                cd /data/app/resources/frontend && docker compose up -d --force-recreate
            fi
