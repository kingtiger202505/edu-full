# ===============================
# Gateway 服务配置
# ===============================
# 应用名称
spring.application.name=gateway
# 服务端口
server.port=7700

# 本地静态备用路由（防止 Nacos 路由前缀不匹配导致的 404）
spring.cloud.gateway.routes[0].id=service-system
spring.cloud.gateway.routes[0].uri=lb://service-system
spring.cloud.gateway.routes[0].predicates[0]=Path=/system/**

spring.cloud.gateway.routes[1].id=service-user
spring.cloud.gateway.routes[1].uri=lb://service-user
spring.cloud.gateway.routes[1].predicates[0]=Path=/user/**

spring.cloud.gateway.routes[2].id=service-course
spring.cloud.gateway.routes[2].uri=lb://service-course
spring.cloud.gateway.routes[2].predicates[0]=Path=/course/**

# Nacos 配置中心与注册中心
spring.cloud.nacos.config.server-addr=${NACOS_SERVER_ADDR:8.140.227.42:18848}
spring.cloud.nacos.config.username=${NACOS_USERNAME:nacos}
spring.cloud.nacos.config.password=${NACOS_PASSWORD:nacos2026}
spring.cloud.nacos.config.namespace=${NACOS_NAMESPACE:}

spring.cloud.nacos.discovery.enabled=true
spring.cloud.nacos.discovery.register-enabled=true
spring.cloud.nacos.discovery.server-addr=${NACOS_SERVER_ADDR:8.140.227.42:18848}
spring.cloud.nacos.discovery.username=${NACOS_USERNAME:nacos}
spring.cloud.nacos.discovery.password=${NACOS_PASSWORD:nacos2026}
spring.cloud.nacos.discovery.namespace=${NACOS_NAMESPACE:}
spring.cloud.nacos.discovery.service=${spring.application.name}
spring.cloud.nacos.discovery.port=${server.port}

# Nacos 配置导入
spring.config.import[0]=optional:nacos:application.properties
spring.config.import[1]=optional:nacos:gateway.properties
spring.config.import[2]=optional:classpath:bootstrap-common.properties

# Bean 定义覆盖
spring.main.allow-bean-definition-overriding=true
