# ===============================
# System 服务配置
# ===============================
# 应用名称
spring.application.name=service-system
# 服务端口
server.port=7710

# Nacos 配置中心（直接在此文件配置，确保凭证在 nacos import 处理前可用）
spring.cloud.nacos.config.server-addr=8.140.227.42:18848
spring.cloud.nacos.config.username=nacos
spring.cloud.nacos.config.password=nacos2026
spring.cloud.nacos.config.namespace=
spring.cloud.nacos.discovery.server-addr=8.140.227.42:18848
spring.cloud.nacos.discovery.username=nacos
spring.cloud.nacos.discovery.password=nacos2026
spring.cloud.nacos.discovery.namespace=

# Nacos 配置导入（放在凭证之后，确保处理时凭证已可用）
spring.config.import[0]=nacos:application.properties
spring.config.import[1]=nacos:service-system.properties
# 引入公共配置（其他非 Nacos 共享配置）
spring.config.import[2]=optional:classpath:bootstrap-common.properties

# Bean 定义覆盖
spring.main.allow-bean-definition-overriding=true
