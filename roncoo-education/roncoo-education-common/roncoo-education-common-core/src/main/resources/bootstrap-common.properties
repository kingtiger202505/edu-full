# ===============================
# 公共 Bootstrap 配置
# 所有服务通过 spring.config.import 引入此文件
# ===============================

# 环境配置：默认 dev（本地开发），Docker 部署通过 SPRING_PROFILES_ACTIVE=prod 覆盖
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ---- Nacos 通用认证 ----
spring.cloud.nacos.username=${NACOS_USERNAME:nacos}
spring.cloud.nacos.password=${NACOS_PASSWORD:nacos2026}
spring.cloud.nacos.server-addr=${NACOS_SERVER_ADDR:8.140.227.42:18848}
spring.cloud.nacos.namespace=${NACOS_NAMESPACE:}

# ---- Nacos 服务发现 ----
spring.cloud.nacos.discovery.enabled=true
spring.cloud.nacos.discovery.register-enabled=true
spring.cloud.service-registry.auto-registration.enabled=true
spring.cloud.nacos.discovery.server-addr=${NACOS_SERVER_ADDR:8.140.227.42:18848}
spring.cloud.nacos.discovery.namespace=${NACOS_NAMESPACE:}
spring.cloud.nacos.discovery.username=${NACOS_USERNAME:nacos}
spring.cloud.nacos.discovery.password=${NACOS_PASSWORD:nacos2026}
spring.cloud.nacos.discovery.service=${spring.application.name}
spring.cloud.nacos.discovery.group=DEFAULT_GROUP
spring.cloud.nacos.discovery.ephemeral=true
spring.cloud.nacos.discovery.port=${SPRING_CLOUD_NACOS_DISCOVERY_PORT:${server.port}}
spring.cloud.nacos.discovery.ip=${SPRING_CLOUD_NACOS_DISCOVERY_IP:}

# 防止注册 127.0.0.1 回环地址：只选取局域网卡 IP
spring.cloud.inetutils.use-only-site-local-interfaces=true
spring.cloud.inetutils.preferred-networks=172\\.|10\\.|192\\.168\\.

# ---- Nacos 配置中心 ----
spring.cloud.nacos.config.enabled=true
spring.cloud.nacos.config.server-addr=${NACOS_SERVER_ADDR:8.140.227.42:18848}
spring.cloud.nacos.config.namespace=${NACOS_NAMESPACE:}
spring.cloud.nacos.config.username=${NACOS_USERNAME:nacos}
spring.cloud.nacos.config.password=${NACOS_PASSWORD:nacos2026}

# ---- Nacos 客户端超时 ----
com.alibaba.nacos.client.naming.ctimeout=60000
com.alibaba.nacos.client.config.ctimeout=60000
spring.cloud.nacos.discovery.timeout=60000
spring.cloud.nacos.config.timeout=60000

# ---- 通用配置 ----
spring.main.allow-bean-definition-overriding=true
seata.enabled=${SEATA_ENABLED:false}
